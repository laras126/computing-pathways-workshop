<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #fff;
    font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
  }

  .card {
    width: 1200px;
    height: 630px;
    background: #fff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 32px 72px;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .accent-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: rgb(59, 130, 246);
  }

  .top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .workshop-label {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #888;
  }

  .chiwork-badge {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgb(59, 130, 246);
    border: 1.5px solid rgb(59, 130, 246);
    padding: 6px 14px;
  }

  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8px 0 0;
    max-width: 860px;
  }

  .title {
    font-size: 62px;
    font-weight: 700;
    line-height: 1.2;
    color: #1a1a1a;
    letter-spacing: -0.02em;
  }

  .bottom-row {
    padding-top: 4px;
  }

  .details {
    display: flex;
    gap: 48px;
  }

  .detail-item {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .detail-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgb(59, 130, 246);
  }

  .detail-value {
    font-size: 26px;
    font-weight: 500;
    color: #1a1a1a;
  }

  .url {
    font-size: 22px;
    font-weight: 400;
    color: #aaa;
    letter-spacing: 0.04em;
    margin-top: 16px;
  }

  .deco {
    position: absolute;
    right: 72px;
    top: 50%;
    transform: translateY(-50%);
    width: 180px;
    height: 180px;
    border: 1.5px solid #e8e8e8;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .deco::after {
    content: '';
    width: 110px;
    height: 110px;
    border: 1.5px solid #e0e0e0;
    border-radius: 50%;
  }
</style>
</head>
